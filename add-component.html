            // 收集参数值
            collectParams() {
                const category = document.getElementById('componentCategory').value;
                const subCategory = document.getElementById('componentSubCategory').value;

                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                // 自定义分化参数 fallback
                if (!defs) {
                    const customParams = JSON.parse(localStorage.getItem('customParamDefinitions') || '{}');
                    defs = customParams[category] || null;
                }
                // 过滤掉可能的空元素（防止稀疏数组导致崩溃）
                if (defs) {
                    defs = defs.filter(d => d && d.id);
                }
                if (!defs || defs.length === 0) {
                    const val = document.getElementById('componentValue');
                    return val ? val.value : '';
                }

                const params = defs.map(def => {
                    const value = document.getElementById('param-' + def.id)?.value || '';
                    const unitEl = document.getElementById('param-unit-' + def.id);
                    const unit = unitEl ? (unitEl.value || def.defaultUnit) : '';
                    return { id: def.id, label: def.label, value, unit };
                });

                return JSON.stringify(params);
            }

            // ========== 数据手册本地文件上传 ==========

            handleDatasheetFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (file.size > 50 * 1024 * 1024) {
                    alert('文件大小超过限制（最大 50MB）');
                    event.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.pendingDatasheetFileData = {
                        file: file,
                        data: e.target.result
                    };
                    const fileInfo = document.getElementById('addDatasheetFileInfo');
                    const fileName = document.getElementById('addDatasheetFileName');
                    if (fileInfo && fileName) {
                        fileName.textContent = file.name + ' (' + this.formatFileSize(file.size) + ')';
                        fileInfo.classList.remove('hidden');
                    }
                };
                reader.onerror = () => {
                    alert('文件读取失败，请重试');
                    event.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            }

            removeDatasheetFile() {
                this.pendingDatasheetFileData = null;
                const fileInfo = document.getElementById('addDatasheetFileInfo');
                if (fileInfo) fileInfo.classList.add('hidden');
                const fileInput = document.getElementById('addComponentDatasheetFile');
                if (fileInput) fileInput.value = '';
            }

            formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            addComponent(data) {
                var components = JSON.parse(localStorage.getItem('electronicComponents') || '[]');
                var newComponent = {
                    id: 'comp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    ...data,
                    createdAt: new Date().toISOString()
                };

                components.push(newComponent);

                // 按位置编号排序
                components.sort((a, b) => this.compareLocationNumbers(a.location, b.location));

                localStorage.setItem('electronicComponents', JSON.stringify(components));

                // 保存数据手册文件到 IndexedDB
                if (this.pendingDatasheetFileData) {
                    const dbName = 'ComponentDatasheetsDB';
                    const storeName = 'datasheets';
                    const request = indexedDB.open(dbName, 1);
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(storeName, 'readwrite');
                        tx.objectStore(storeName).put({
                            name: this.pendingDatasheetFileData.file.name,
                            type: this.pendingDatasheetFileData.file.type || 'application/octet-stream',
                            size: this.pendingDatasheetFileData.file.size,
                            data: this.pendingDatasheetFileData.data,
                            savedAt: new Date().toISOString()
                        }, newComponent.id);
                        tx.oncomplete = () => {
                            this.pendingDatasheetFileData = null;
                            db.close();
                        };
                    };
                }

                // 如果初始库存大于0，记录入库历史
                if (data.stock > 0) {
                    this.saveHistoryRecord('inbound', data.name, data.stock, 0, data.stock);
                }

                // 同步到服务端文件（同步 XHR，跳转前一定送达）
                this.syncToServer(components);

                return newComponent;
            }

            // 同步数据到服务端文件
            syncToServer(components, sync) {
                // 使用同步 XHR 确保跳转前数据一定到达服务端
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/data/components', false);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(JSON.stringify({ components: components }));
                    if (xhr.status !== 200) {
                        console.warn('[XHR] 同步到服务端失败:', xhr.status);
                    } else if (sync) {
                        // 同步设置到服务端
                        var settingsXhr = new XMLHttpRequest();
                        settingsXhr.open('POST', '/api/settings', false);
                        settingsXhr.setRequestHeader('Content-Type', 'application/json');
                        var allSettings = {};
                        ['systemSettings','subCategorySettings','locationPrefixConfig',
                         'categoryOrder','customCategories','customParamDefinitions'].forEach(function(k) {
                            var v = localStorage.getItem(k);
                            if (v) { try { allSettings[k] = JSON.parse(v); } catch(e) {} }
                        });
                        settingsXhr.send(JSON.stringify(allSettings));
                    }
                } catch (e) {
                    console.warn('[Server] 服务端未运行，同步已跳过');
                }
            }

            // 比较位置编号（用于排序）
            compareLocationNumbers(locA, locB) {
                // 如果两个都没有位置编号，保持原顺序
                if (!locA && !locB) return 0;
                // 如果只有a没有位置编号，a排在后面
                if (!locA) return 1;
                // 如果只有b没有位置编号，b排在后面
                if (!locB) return -1;

                // 解析位置编号格式：前缀-数字（如 A-001, B-123）
                const parseLocation = (loc) => {
                    const match = loc.match(/^([A-Za-z]+)-(\d+)$/);
                    if (match) {
                        return {
                            prefix: match[1].toUpperCase(),
                            number: parseInt(match[2], 10)
                        };
                    }
                    // 如果格式不匹配，返回原始字符串用于排序
                    return { prefix: loc.toUpperCase(), number: null };
                };

                const parsedA = parseLocation(locA);
                const parsedB = parseLocation(locB);

                // 先按前缀排序
                if (parsedA.prefix !== parsedB.prefix) {
                    return parsedA.prefix.localeCompare(parsedB.prefix);
                }

                // 如果前缀相同且都有数字，按数字排序
                if (parsedA.number !== null && parsedB.number !== null) {
                    return parsedA.number - parsedB.number;
                }

                // 如果只有一个有数字，有数字的排在前面
                if (parsedA.number !== null) return -1;
                if (parsedB.number !== null) return 1;

                // 都没有数字，保持原顺序
                return 0;
            }

            // 保存出入库历史记录
            saveHistoryRecord(type, componentName, quantity, beforeStock, afterStock) {
                const key = type === 'checkout' ? 'checkoutHistory' : 'inboundHistory';
                const history = JSON.parse(localStorage.getItem(key) || '[]');

                const record = {
                    id: Date.now().toString(),
                    componentName,
                    quantity,
                    beforeStock,
                    afterStock,
                    timestamp: new Date().toISOString()
                };

                history.push(record);

                // 只保留最近100条
                if (history.length > 100) {
                    history.splice(0, history.length - 100);
                }

                localStorage.setItem(key, JSON.stringify(history));
            }
            
            getDefaultImage(category) {
                const defaultImages = {
                    resistor: 'resources/images/resistors/resistor-collection.png',
                    capacitor: 'resources/images/capacitors/capacitor-collection.png',
                    inductor: 'https://kimi-web-img.moonshot.cn/img/upload.wikimedia.org/a2f2e16f8969ba3d2db5fb18bd86a57a05f18f6e.jpg',
                    transistor: 'https://kimi-web-img.moonshot.cn/img/www.buerklin.com/9318c346e9c8d3d4e9bc8df611e2bab6cae269f8.jpg',
                    diode: 'https://kimi-web-img.moonshot.cn/img/www.build-electronic-circuits.com/659b68c0c152c997f401ca30d570b2c98614aa04.jpg',
                    mosfet: 'https://kimi-web-img.moonshot.cn/img/www.build-electronic-circuits.com/659b68c0c152c997f401ca30d570b2c98614aa04.jpg',
                    led: 'https://kimi-web-img.moonshot.cn/img/www.buerklin.com/9318c346e9c8d3d4e9bc8df611e2bab6cae269f8.jpg',
                    crystal: 'resources/images/hero-circuit-board.png',
                    ic: 'resources/images/ics/ic-collection.png'
                };
                return defaultImages[category] || 'resources/images/hero-circuit-board.png';
            }
            
            saveAndContinue() {
                try {
                    const data = this.getFormData();
                    if (!this.validateForm(data)) return;

                    this.addComponent(data);
                    this.showNotification('元器件添加成功！可以继续添加下一个。', 'success');
                    this.resetForm();
                } catch (e) {
                    console.error('保存元器件失败:', e);
                    this.showNotification('保存失败: ' + e.message, 'error');
                }
            }

            saveAndReturn() {
                try {
                    const data = this.getFormData();
                    if (!this.validateForm(data)) return;

                    // addComponent 内部用同步 XHR 写文件，完成后才返回
                    this.addComponent(data);
                    this.showNotification('元器件添加成功！', 'success');
                    window.location.href = 'index.html';
                } catch (e) {
                    console.error('保存元器件失败:', e);
                    this.showNotification('保存失败: ' + e.message, 'error');
                }
            }
            
            resetForm() {
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.value = val || '';
                };
                setVal('componentName', '');
                setVal('componentModel', '');
                setVal('componentBrand', '');
                setVal('componentProductCode', '');
                setVal('componentCategory', '');
                setVal('componentValue', '');
                setVal('componentSubCategory', '');
                setVal('componentStock', '');
                setVal('componentThreshold', '');
                setVal('componentPrice', '');
                setVal('componentLocation', '');
                setVal('componentNotes', '');
                setVal('componentDatasheet', '');
                setVal('componentImage', '');

                // 重新渲染参数字段（恢复为默认状态）
                this.updateParamFields();
                this.updatePreview();
            }
            
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 ${
                    type === 'success' ? 'bg-green-600' : 
                    type === 'error' ? 'bg-red-600' : 'bg-blue-600'
                } text-white`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                }, 100);
                
                setTimeout(() => {
                    notification.classList.add('translate-x-full');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            window.addComponentManager = new AddComponentManager();
        });
    </script>

                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">模板名称</label>
                                    <input type="text" id="templateName" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：1kΩ电阻">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">分类 *</label>
                                    <select id="templateCategory" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none">
                                        <option value="">选择分类</option>
                                        <option value="resistor">电阻</option>
                                        <option value="capacitor">电容</option>
                                        <option value="inductor">电感</option>
                                        <option value="transistor">三极管</option>
                                        <option value="mosfet">MOS管</option>
                                        <option value="diode">二极管</option>
                                        <option value="led">LED</option>
                                        <option value="ic">集成电路</option>
                                        <option value="switch">开关</option>
                                        <option value="crystal">晶振</option>
                                        <option value="other">其他</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">子类别</label>
                                    <select id="templateSubCategory" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none">
                                        <option value="">请先选择分类</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">型号规格</label>
                                    <input type="text" id="templateModel" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：CF1/4W-1KΩ-J">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">品牌</label>
                                    <input type="text" id="templateBrand" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：Murata">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">商品编码</label>
                                    <input type="text" id="templateProductCode" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：PNP-2024-001">
                                </div>
                                <div id="templateParamFields">
                                    <label class="block text-sm font-medium text-gray-300 mb-2">参数值</label>
                                    <input type="text" id="templateValue" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：1kΩ">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">初始库存</label>
                                    <input type="number" id="templateStock" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="100" min="0">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">预警阈值</label>
                                    <input type="number" id="templateThreshold" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="20" min="0">
                                </div>
                            </div>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-300 mb-2 flex items-center">
                                    卡片显示文字
                                    <span class="ml-2 text-xs text-gray-500 font-normal">（可选，留空则自动生成）</span>
                                </label>
                                <input type="text" id="templateDisplayText" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：1kΩ 碳膜电阻">
                                <p class="text-xs text-gray-500 mt-1">此文字将显示在快速模板卡片上</p>
                            </div>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-300 mb-2">备注信息</label>
                                <textarea id="templateNotes" rows="2" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：碳膜电阻 精度±5%"></textarea>
                            </div>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-300 mb-2">元器件图片</label>
                                <input type="url" id="templateImage" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="https://example.com/image.jpg">
                                <p class="text-xs text-gray-500 mt-1">可选：输入图片的在线链接，留空则使用默认图片</p>
                            </div>
                            <div class="mt-4">
                                <button id="templateSubmitBtn" type="submit" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors">
                                    添加模板
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- 现有模板列表 -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                            现有模板
                        </h3>
                        <div id="templatesList" class="space-y-3">
                            <!-- 模板列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
