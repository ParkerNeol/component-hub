<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加元器件 - 电子元器件管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1a1d29;
            --bg-secondary: #242938;
            --bg-card: #2a2f42;
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b35;
            --text-primary: #f1f2f6;
            --text-secondary: #a4a6b3;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .circuit-bg {
            background-image: 
                radial-gradient(circle at 25px 25px, rgba(0, 212, 255, 0.1) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px, 25px 25px, 25px 25px;
        }
        
        .form-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        
        .form-input {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            outline: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #0099cc);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.1);
        }
        
        .template-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .template-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .template-card:hover::before {
            opacity: 1;
        }

        .template-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px -10px rgba(0, 212, 255, 0.3);
        }

        .template-card:active {
            transform: translateY(-1px) scale(0.98);
        }
        
        .preview-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            position: sticky;
            top: 24px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent-primary);
            background: transparent;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .quantity-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: scale(1.1);
        }
        
        .quantity-btn-compact {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--accent-primary);
            background: transparent;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .quantity-btn-compact:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: scale(1.1);
        }

        @media (min-width: 640px) {
            .quantity-btn-compact {
                width: 32px;
                height: 32px;
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 全局滚动条样式 - 与页面风格一致 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent-primary), #0099cc);
            border-radius: 5px;
            border: 2px solid var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00e5ff, #00b8e6);
        }

        /* Firefox 滚动条样式 */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) var(--bg-secondary);
        }
    </style>
</head>
<body class="circuit-bg min-h-screen">
    <!-- 头部导航 -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-gray-900/50 backdrop-blur-sm border-b border-gray-700/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                        添加元器件
                    </h1>
                </div>
                
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <button id="resetFormBtn" class="text-gray-400 hover:text-white hover:bg-gray-700 p-2 rounded-md transition-colors" title="重置表单">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                    <button id="saveAndContinueBtn" class="btn-primary px-3 sm:px-4 py-2 text-sm">
                        保存并继续
                    </button>
                    <button id="saveAndReturnBtn" class="btn-secondary px-3 sm:px-4 py-2 text-sm">
                        保存并返回
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 表单区域 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 基本信息 -->
                <div class="form-card p-6 fade-in">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center mr-3">
                            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        基本信息
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                元器件名称 <span class="text-red-400">*</span>
                            </label>
                            <input type="text" id="componentName" required 
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="请输入元器件名称">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                型号规格 <span class="text-red-400">*</span>
                            </label>
                            <input type="text" id="componentModel" required 
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="如: CF1/4W-1KΩ-J">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                品牌
                            </label>
                            <input type="text" id="componentBrand"
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="如: Murata、Yageo、ST">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                商品编码
                            </label>
                            <input type="text" id="componentProductCode"
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="如：PNP-2024-001">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                类别 <span class="text-red-400">*</span>
                            </label>
                            <select id="componentCategory" required
                                    class="form-input w-full px-4 py-3 text-white">
                                <option value="">请选择类别</option>
                                <option value="resistor">电阻</option>
                                <option value="capacitor">电容</option>
                                <option value="inductor">电感</option>
                                <option value="transistor">三极管</option>
                                <option value="mosfet">MOS管</option>
                                <option value="diode">二极管</option>
                                <option value="led">LED</option>
                                <option value="ic">集成电路</option>
                                <option value="switch">开关</option>
                                <option value="crystal">晶振</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">子类别</label>
                            <select id="componentSubCategory"
                                    class="form-select w-full px-4 py-3 text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="">请先选择类别</option>
                            </select>
                        </div>
                    </div>
                    <div id="paramFields" class="mt-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">参数值</label>
                            <input type="text" id="componentValue"
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="如: 1kΩ, 100μF, NPN">
                        </div>
                    </div>
                </div>

                <!-- 库存信息 -->
                <div class="form-card p-6 fade-in">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <div class="w-8 h-8 bg-yellow-500/20 rounded-lg flex items-center justify-center mr-3">
                            <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                        库存信息
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                初始库存 <span class="text-red-400">*</span>
                            </label>
                            <input type="number" id="componentStock" min="0" required
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="请输入库存数量">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                预警阈值 <span class="text-red-400">*</span>
                            </label>
                            <input type="number" id="componentThreshold" min="0" required
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="低于此数量时预警">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">
                                价格（元）
                            </label>
                            <input type="number" id="componentPrice" min="0" step="any"
                                   class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="可选">
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-300 mb-2">存放位置</label>
                        <div class="flex gap-2">
                            <input type="text" id="componentLocation"
                                   class="form-input w-48 px-4 py-3 text-white placeholder-gray-500"
                                   placeholder="如: A1-3, B2-5">
                            <button type="button" id="autoComponentLocationBtn" class="px-4 py-3 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white rounded-lg transition-all duration-300 text-sm whitespace-nowrap flex items-center gap-2 shadow-lg shadow-blue-600/20 hover:shadow-blue-600/40 hover:scale-105" title="自动分配最小可用编号">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                </svg>
                                <span>自动分配</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 附加信息 -->
                <div class="form-card p-6 fade-in">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <div class="w-8 h-8 bg-green-500/20 rounded-lg flex items-center justify-center mr-3">
                            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10m0 0V6a2 2 0 00-2-2H9a2 2 0 00-2 2v2m0 0v8a2 2 0 002 2h6a2 2 0 002-2V8"></path>
                            </svg>
                        </div>
                        附加信息
                    </h2>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">备注信息</label>
                        <textarea id="componentNotes" rows="4"
                                  class="form-input w-full px-4 py-3 text-white placeholder-gray-500 resize-none"
                                  placeholder="请输入备注信息，如用途、供应商等"></textarea>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-300 mb-2">数据手册</label>
                        <div class="relative">
                            <input type="url" id="componentDatasheet"
                                   class="form-input w-full px-4 py-3 pr-12 text-white placeholder-gray-500"
                                   placeholder="https://example.com/datasheet.pdf">
                            <svg class="absolute right-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <p class="text-sm text-gray-500 mt-2">可选：输入数据手册（Datasheet）的在线链接，方便查看元器件规格</p>
                        <div class="flex items-center space-x-2 mt-2">
                            <span class="text-gray-500 text-sm">或</span>
                            <label class="cursor-pointer bg-gray-600 hover:bg-gray-500 text-white text-sm px-3 py-1.5 rounded-lg transition-colors inline-flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                </svg>
                                <span>上传本地文件</span>
                                <input type="file" id="addComponentDatasheetFile" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg" class="hidden">
                            </label>
                        </div>
                        <div id="addDatasheetFileInfo" class="hidden flex items-center justify-between bg-gray-700 rounded-lg p-2 mt-2">
                            <div class="flex items-center space-x-2 truncate flex-1">
                                <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                <span id="addDatasheetFileName" class="text-sm text-gray-300 truncate"></span>
                            </div>
                            <button class="text-red-400 hover:text-red-300 p-1 shrink-0" title="移除文件" onclick="addComponentManager.removeDatasheetFile()">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-300 mb-2">元器件图片</label>
                        <input type="url" id="componentImage"
                               class="form-input w-full px-4 py-3 text-white placeholder-gray-500"
                               placeholder="https://example.com/image.jpg">
                        <p class="text-sm text-gray-500 mt-2">可选：输入图片的在线链接，留空则使用默认图片</p>
                    </div>
                </div>

                <!-- 快速模板 -->
                <div class="form-card p-6 fade-in">
                    <h2 class="text-lg font-semibold mb-6 flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-8 h-8 bg-purple-500/20 rounded-lg flex items-center justify-center mr-3">
                                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                                </svg>
                            </div>
                            快速模板
                        </div>
                        <button id="manageTemplatesBtn" class="px-3 py-1 text-sm bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors flex items-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            <span>管理模板</span>
                        </button>
                    </h2>

                    <!-- 提示信息 -->
                    <div id="noTemplatesHint" class="text-center py-8 text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                        </svg>
                        <p class="text-sm">暂无模板</p>
                        <p class="text-xs mt-1">点击"管理模板"按钮添加自定义模板</p>
                    </div>

                    <!-- 自定义模板 -->
                    <div id="customTemplatesSection" class="hidden">
                        <div id="customTemplatesList" class="space-y-5"></div>
                    </div>
                </div>
            </div>

            <!-- 预览区域 -->
            <div class="lg:col-span-1">
                <div class="preview-card p-3 sm:p-4 lg:p-6 fade-in">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <div class="w-8 h-8 bg-indigo-500/20 rounded-lg flex items-center justify-center mr-3">
                            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </div>
                        实时预览
                    </h2>
                    
                    <div id="componentPreview">
                        <div class="text-center py-8">
                            <div class="w-16 h-16 bg-gray-700 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                                </svg>
                            </div>
                            <p class="text-gray-400">填写信息查看预览</p>
                        </div>
                    </div>
                </div>
                

            </div>
        </div>
    </div>

    <script>
        class AddComponentManager {
            constructor() {
                this.formData = {};
                this.editingTemplateId = null; // 当前正在编辑的模板ID
                this.pendingDatasheetFileData = null; // 暂存上传的数据手册文件
                this.init();
            }
            
            init() {
                this.bindEvents();
                this.initAnimations();
                this.loadTemplates();
                this.updateSubCategoryOptions();
                this.updateParamFields();
                this.loadCustomCategoriesIntoForm();
            }

            // 将自定义类别动态追加到表单下拉框
            loadCustomCategoriesIntoForm() {
                const custom = JSON.parse(localStorage.getItem('customCategories') || '[]');
                const builtInKeys = ['resistor', 'capacitor', 'inductor', 'transistor', 'mosfet', 'diode', 'led', 'ic', 'switch', 'crystal', 'other'];
                custom.forEach(cat => {
                    if (builtInKeys.includes(cat.key)) return; // 不重复添加
                    ['componentCategory', 'templateCategory'].forEach(selectId => {
                        const select = document.getElementById(selectId);
                        if (!select) return;
                        // 跳过已存在的
                        if (select.querySelector(`option[value="${cat.key}"]`)) return;
                        const opt = document.createElement('option');
                        opt.value = cat.key;
                        opt.textContent = cat.name;
                        select.appendChild(opt);
                    });
                });
            }
            
            bindEvents() {
                // 表单输入事件
                const inputs = ['componentName', 'componentModel', 'componentBrand', 'componentCategory', 'componentValue',
                               'componentStock', 'componentThreshold', 'componentLocation', 'componentNotes',
                               'componentProductCode', 'componentPrice'];

                inputs.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.addEventListener('input', () => this.updatePreview());
                        element.addEventListener('change', () => this.updatePreview());
                    }
                });

                // 类别切换时更新子类别
                document.getElementById('componentCategory').addEventListener('change', () => {
                    this.updateSubCategoryOptions();
                    this.updateParamFields();
                    this.updatePreview();
                });
                
                // 子类别切换时重新渲染分化参数
                document.getElementById('componentSubCategory').addEventListener('change', () => {
                    this.updateParamFields();
                    this.updatePreview();
                });

                // 图片链接输入监听
                document.getElementById('componentImage').addEventListener('input', () => {
                    this.updatePreview();
                });

                // 数据手册链接输入监听
                document.getElementById('componentDatasheet').addEventListener('input', () => {
                    this.updatePreview();
                });

                // 数据手册文件上传事件
                const datasheetFileInput = document.getElementById('addComponentDatasheetFile');
                if (datasheetFileInput) {
                    datasheetFileInput.addEventListener('change', (e) => {
                        this.handleDatasheetFileUpload(e);
                    });
                }

                document.getElementById('resetFormBtn').addEventListener('click', () => {
                    this.resetForm();
                });

                document.getElementById('saveAndContinueBtn').addEventListener('click', () => {
                    this.saveAndContinue();
                });

                document.getElementById('saveAndReturnBtn').addEventListener('click', () => {
                    this.saveAndReturn();
                });

                // 全页面 Enter 键支持：按 Enter 触发保存

                // 自动分配位置编号按钮
                const autoComponentLocationBtn = document.getElementById('autoComponentLocationBtn');
                if (autoComponentLocationBtn) {
                    autoComponentLocationBtn.addEventListener('click', () => this.autoAssignComponentLocation());
                }

                // 模板管理
                const manageTemplatesBtn = document.getElementById('manageTemplatesBtn');
                if (manageTemplatesBtn) {
                    manageTemplatesBtn.addEventListener('click', () => this.openTemplateManager());
                }

                const closeTemplateManager = document.getElementById('closeTemplateManager');
                if (closeTemplateManager) {
                    closeTemplateManager.addEventListener('click', () => this.closeTemplateManager());
                }

                // 添加模板表单
                const addTemplateForm = document.getElementById('addTemplateForm');
                if (addTemplateForm) {
                    addTemplateForm.addEventListener('submit', (e) => this.addTemplate(e));
                }

                // 取消编辑模板按钮
                const cancelEditTemplateBtn = document.getElementById('cancelEditTemplate');
                if (cancelEditTemplateBtn) {
                    cancelEditTemplateBtn.addEventListener('click', () => this.cancelEditTemplate());
                }

                // 模板表单 - 类别切换时更新子类别和参数
                const templateCategorySelect = document.getElementById('templateCategory');
                if (templateCategorySelect) {
                    templateCategorySelect.addEventListener('change', () => {
                        this.updateTemplateSubCategoryOptions();
                        this.updateTemplateParamFields();
                    });
                }

                // 模板表单 - 子类别切换时更新参数
                const templateSubCategorySelect = document.getElementById('templateSubCategory');
                if (templateSubCategorySelect) {
                    templateSubCategorySelect.addEventListener('change', () => {
                        this.updateTemplateParamFields();
                    });
                }
            }

            initAnimations() {
                anime({
                    targets: '.fade-in',
                    opacity: [0, 1],
                    translateY: [20, 0],
                    delay: anime.stagger(100),
                    duration: 600,
                    easing: 'easeOutQuart'
                });
            }
            
            updatePreview() {
                const name = document.getElementById('componentName').value || '元器件名称';
                const model = document.getElementById('componentModel').value || '型号规格';
                const brand = document.getElementById('componentBrand').value || '';
                const productCode = document.getElementById('componentProductCode').value || '';
                const category = document.getElementById('componentCategory').value || '';
                const subCategory = document.getElementById('componentSubCategory').value || '';
                
                // 根据类别读取参数值（支持分化参数）
                let value = '-';
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                if (defs) {
                    const vals = [];
                    defs.forEach(def => {
                        const v = document.getElementById('param-' + def.id);
                        const u = document.getElementById('param-unit-' + def.id);
                        if (v && v.value) {
                            vals.push(v.value + (u ? u.value : (def.defaultUnit || '')));
                        }
                    });
                    if (vals.length > 0) value = vals.join('|');
                } else {
                    const el = document.getElementById('componentValue');
                    if (el) value = el.value || '-';
                }
                
                const stock = parseInt(document.getElementById('componentStock').value) || 0;
                const threshold = parseInt(document.getElementById('componentThreshold').value) || 0;
                const price = parseFloat(document.getElementById('componentPrice')?.value) || 0;
                const location = document.getElementById('componentLocation').value || '-';
                
                const categoryNames = {
                    resistor: '电阻',
                    capacitor: '电容',
                    inductor: '电感',
                    transistor: '三极管',
                    mosfet: 'MOS管',
                    diode: '二极管',
                    led: 'LED',
                    crystal: '晶振',
                    ic: '集成电路',
                    switch: '开关',
                    other: '其他'
                };
                
                const stockStatus = stock === 0 ? 'empty' : stock <= threshold ? 'warning' : 'full';
                const stockColors = {
                    full: 'bg-green-500',
                    warning: 'bg-yellow-500',
                    empty: 'bg-red-500'
                };
                const stockText = {
                    full: '充足',
                    warning: '预警',
                    empty: '缺货'
                };
                
                const stockPercent = Math.min(100, (stock / Math.max(threshold * 3, 1)) * 100);
                const previewImage = document.getElementById('componentImage').value.trim() || this.getDefaultImage(category);
                // 支持自定义类别名称显示
                const customCats = JSON.parse(localStorage.getItem('customCategories') || '[]');
                const catName = categoryNames[category] || customCats.find(c => c.key === category)?.name || category;
                const categoryDisplay = catName + (subCategory ? ' / ' + subCategory : '');
                
                // 生成与主页 getComponentCardHTML 完全一致的卡片结构
                const previewHTML = `
                    <div class="flex items-start justify-between mb-2 sm:mb-3 lg:mb-4">
                        <div class="flex-1">
                            <h3 class="text-sm sm:text-base lg:text-lg font-semibold text-white mb-0.5">${name}</h3>
                            <p class="text-xs sm:text-sm text-gray-400 truncate">${model}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full ${stockColors[stockStatus]}"></div>
                            <span class="text-xs text-gray-400">${stockText[stockStatus]}</span>
                        </div>
                    </div>

                    <div class="mb-2 sm:mb-3 lg:mb-4">
                        <img src="${previewImage}" alt="${name}"
                             class="w-full h-20 sm:h-28 lg:h-32 object-cover rounded-lg bg-gray-700"
                             onerror="this.src='resources/images/hero-circuit-board.png'">
                    </div>

                    <div class="space-y-1 sm:space-y-1.5 lg:space-y-2 mb-2 sm:mb-3 lg:mb-4">
                        <div class="flex justify-between text-xs sm:text-sm">
                            <span class="text-gray-400">类别:</span>
                            <span class="text-white">${categoryDisplay}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">品牌:</span>
                            <span class="text-white">${brand || '-'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">商品编码:</span>
                            <span class="text-white">${productCode || '-'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">参数:</span>
                            <span class="text-white">${value}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">位置:</span>
                            <span class="text-white">${location}</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-2 sm:mb-3 lg:mb-4">
                        <div class="flex items-center space-x-3">
                            <button class="quantity-btn-compact sm:quantity-btn">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                                </svg>
                            </button>
                            <div class="text-center">
                                <div class="stock-text text-base sm:text-lg font-bold text-white">${stock}</div>
                                <div class="text-xs text-gray-400">库存</div>
                            </div>
                            <button class="quantity-btn-compact sm:quantity-btn">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="stock-indicator h-1.5 sm:h-2 bg-gray-700 rounded-full overflow-hidden mb-2 sm:mb-3 lg:mb-4">
                        <div class="h-full ${stockColors[stockStatus]} transition-all duration-300"
                             style="width: ${stockPercent}%"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button class="py-1.5 sm:py-2 text-xs sm:text-sm rounded-lg border-2 border-orange-400 text-orange-400 hover:bg-orange-400 hover:text-white transition-all duration-300 flex items-center justify-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                            </svg>
                            <span>出库</span>
                        </button>
                        <button class="py-1.5 sm:py-2 text-xs sm:text-sm rounded-lg border-2 border-green-400 text-green-400 hover:bg-green-400 hover:text-white transition-all duration-300 flex items-center justify-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <span>入库</span>
                        </button>
                    </div>

                    <button class="w-full btn-primary py-1.5 sm:py-2 text-xs sm:text-sm">
                        查看详情
                    </button>
                `;
                
                document.getElementById('componentPreview').innerHTML = previewHTML;
            }
            
            loadTemplates() {
                this.templates = {};

                // 加载自定义模板
                this.loadCustomTemplates();
            }

            // 加载自定义模板
            loadCustomTemplates() {
                try {
                    const saved = localStorage.getItem('customTemplates');
                    if (saved) {
                        const customTemplates = JSON.parse(saved);
                        Object.assign(this.templates, customTemplates);
                    }
                } catch (error) {
                    console.error('加载自定义模板失败:', error);
                }

                // 渲染自定义模板到页面
                this.renderTemplateCards();
            }

            // 保存自定义模板
            saveCustomTemplates() {
                const customTemplates = {};
                Object.keys(this.templates).forEach(key => {
                    if (key.startsWith('custom-')) {
                        customTemplates[key] = this.templates[key];
                    }
                });
                localStorage.setItem('customTemplates', JSON.stringify(customTemplates));
            }

            // 打开模板管理模态框
            openTemplateManager() {
                document.getElementById('templateManagerModal').classList.remove('hidden');
                this.renderTemplatesList();
            }

            // 关闭模板管理模态框
            closeTemplateManager() {
                document.getElementById('templateManagerModal').classList.add('hidden');
            }

            // 渲染模板列表
            renderTemplatesList() {
                const container = document.getElementById('templatesList');
                container.innerHTML = '';

                // 按分类分组
                const categoryGroups = {};
                Object.keys(this.templates).forEach(key => {
                    const template = this.templates[key];
                    if (!categoryGroups[template.category]) {
                        categoryGroups[template.category] = [];
                    }
                    categoryGroups[template.category].push({ id: key, ...template });
                });

                // 渲染每个分类
                const categoryNames = {
                    resistor: '电阻',
                    capacitor: '电容',
                    inductor: '电感',
                    transistor: '三极管',
                    mosfet: 'MOS管',
                    diode: '二极管',
                    led: 'LED',
                    ic: '集成电路',
                    switch: '开关',
                    crystal: '晶振',
                    other: '其他'
                };

                Object.keys(categoryGroups).sort().forEach(category => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'mb-6';

                    const categoryTitle = document.createElement('h4');
                    categoryTitle.className = 'text-sm font-semibold text-gray-300 mb-3';
                    categoryTitle.textContent = categoryNames[category] || category;
                    groupDiv.appendChild(categoryTitle);

                    const templatesGrid = document.createElement('div');
                    templatesGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';

                    categoryGroups[category].forEach(template => {
                        const isCustom = template.id.startsWith('custom-');
                        const templateDiv = document.createElement('div');
                        templateDiv.className = `bg-gray-700/50 rounded-lg p-3 ${isCustom ? 'border border-green-500/30' : ''}`;

                        const headerDiv = document.createElement('div');
                        headerDiv.className = 'flex items-start justify-between mb-1';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'flex-1';

                        const nameSpan = document.createElement('div');
                        nameSpan.className = 'font-medium text-white text-sm';
                        nameSpan.textContent = template.name || '未命名';
                        nameDiv.appendChild(nameSpan);

                        const valueSpan = document.createElement('div');
                        valueSpan.className = 'text-xs text-gray-400';
                        valueSpan.textContent = `${template.model} | ${template.value}`;
                        nameDiv.appendChild(valueSpan);

                        // 显示自定义显示文字（如果有）
                        if (template.displayText && template.displayText.trim()) {
                            const displayTextSpan = document.createElement('div');
                            displayTextSpan.className = 'text-xs text-green-400 mt-0.5';
                            displayTextSpan.innerHTML = `<span class="text-gray-500">显示:</span> ${template.displayText.trim()}`;
                            nameDiv.appendChild(displayTextSpan);
                        }

                        // 显示品牌和商品编码
                        if (template.brand) {
                            const brandSpan = document.createElement('div');
                            brandSpan.className = 'text-xs text-gray-400';
                            brandSpan.textContent = `品牌: ${template.brand}`;
                            nameDiv.appendChild(brandSpan);
                        }
                        if (template.productCode) {
                            const codeSpan = document.createElement('div');
                            codeSpan.className = 'text-xs text-gray-400';
                            codeSpan.textContent = `编码: ${template.productCode}`;
                            nameDiv.appendChild(codeSpan);
                        }

                        headerDiv.appendChild(nameDiv);

                        // 只允许删除自定义模板
                        if (isCustom) {
                            const actionsDiv = document.createElement('div');
                            actionsDiv.className = 'flex items-center space-x-1';

                            // 编辑按钮
                            const editBtn = document.createElement('button');
                            editBtn.className = 'p-0.5 hover:bg-blue-600/50 rounded transition-colors text-blue-400';
                            editBtn.innerHTML = `
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            `;
                            editBtn.title = '编辑模板';
                            editBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                this.editTemplate(template.id);
                            });
                            actionsDiv.appendChild(editBtn);

                            // 删除按钮
                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = 'p-0.5 hover:bg-red-600/50 rounded transition-colors text-red-400';
                            deleteBtn.innerHTML = `
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            `;
                            deleteBtn.title = '删除模板';
                            deleteBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                this.deleteTemplate(template.id);
                            });
                            actionsDiv.appendChild(deleteBtn);

                            headerDiv.appendChild(actionsDiv);
                        }

                        templateDiv.appendChild(headerDiv);

                        const detailsDiv = document.createElement('div');
                        detailsDiv.className = 'grid grid-cols-2 gap-1 text-xs text-gray-400';

                        detailsDiv.innerHTML = `
                            <div>库存: ${template.stock}</div>
                            <div>预警: ${template.threshold}</div>
                            <div class="col-span-2">备注: ${template.notes || '-'}</div>
                        `;
                        templateDiv.appendChild(detailsDiv);

                        // 点击模板应用
                        templateDiv.style.cursor = 'pointer';
                        templateDiv.addEventListener('click', (e) => {
                            // 如果点击的是删除按钮，不应用模板
                            if (e.target.closest('button')) return;
                            this.applyTemplate(template.id);
                            this.closeTemplateManager();
                        });

                        templatesGrid.appendChild(templateDiv);
                    });

                    groupDiv.appendChild(templatesGrid);
                    container.appendChild(groupDiv);
                });
            }

            // 更新模板表单的子类别选项
            updateTemplateSubCategoryOptions() {
                const category = document.getElementById('templateCategory').value;
                const subCategorySelect = document.getElementById('templateSubCategory');
                if (!subCategorySelect) return;

                subCategorySelect.innerHTML = '<option value="">' + (category ? '选择子类别' : '请先选择分类') + '</option>';
                
                if (!category) return;

                // 从 localStorage 读取子类别配置
                const saved = localStorage.getItem('subCategorySettings');
                let settings = null;
                if (saved) {
                    try { settings = JSON.parse(saved); } catch (e) {}
                }

                const defaults = {
                    resistor: ['贴片电阻', '金属膜电阻', '碳膜电阻', '线绕电阻', '电位器', 'NTC热敏电阻', '可变电阻'],
                    capacitor: ['陶瓷电容', '铝电解电容', '钽电容', '薄膜电容', 'MLCC贴片电容', '可变电容', '超级电容'],
                    inductor: ['功率电感', '贴片电感', '滤波电感', '射频电感', '变压器', '扼流圈', '磁环电感'],
                    transistor: ['NPN三极管', 'PNP三极管', '达林顿管', '光敏三极管', '射频三极管'],
                    mosfet: ['N沟道MOS', 'P沟道MOS', '双MOS', 'LDO MOS'],
                    diode: ['整流二极管', '肖特基二极管', '稳压二极管', 'TVS二极管', '发光二极管', '光电二极管', '整流桥'],
                    led: ['贴片LED', '直插LED', 'RGB LED', '大功率LED', '红外LED', '紫外LED', '数码管'],
                    ic: ['单片机', '线性稳压器(LDO)', 'DC-DC电源芯片', 'LED驱动', '电池管理', '运算放大器', '逻辑门', '存储器', '接口IC'],
                    switch: ['轻触开关', '拨动开关', '旋转开关', 'DIP开关', '微动开关', '船形开关'],
                    crystal: ['HC49晶振', '贴片晶振', '有源晶振', '温补晶振'],
                    other: ['连接器', '保险丝', '继电器', '传感器', '线材', 'PCB板']
                };

                const items = (settings && settings[category]) ? settings[category] : (defaults[category] || []);

                items.forEach(subCat => {
                    const option = document.createElement('option');
                    option.value = subCat;
                    option.textContent = subCat;
                    subCategorySelect.appendChild(option);
                });
            }

            // 更新模板表单的分化参数字段
            updateTemplateParamFields() {
                const container = document.getElementById('templateParamFields');
                if (!container) return;

                const category = document.getElementById('templateCategory').value;
                const subCategory = document.getElementById('templateSubCategory').value;

                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                // 自定义分化参数 fallback
                if (!defs) {
                    const customParams = JSON.parse(localStorage.getItem('customParamDefinitions') || '{}');
                    defs = customParams[category] || null;
                }

                if (!defs) {
                    container.innerHTML = '<label class="block text-sm font-medium text-gray-300 mb-2">参数值</label>' +
                        '<input type="text" id="templateValue" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="如：1kΩ, 100μF, NPN">';
                    return;
                }

                let html = '';
                defs.forEach(def => {
                    html += '<div class="mb-3">' +
                        '<label class="block text-sm font-medium text-gray-300 mb-2">' + def.label + '</label>' +
                        '<div class="flex space-x-2">' +
                        '<input type="text" id="template-param-' + def.id + '" value="" class="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="输入' + def.label + '">';
                    if (def.units && def.units.length > 0) {
                        html += '<select id="template-param-unit-' + def.id + '" class="w-24 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none">';
                        def.units.forEach(u => {
                            html += '<option value="' + u + '"' + (u === def.defaultUnit ? ' selected' : '') + '>' + u + '</option>';
                        });
                        html += '</select>';
                    }
                    html += '</div></div>';
                });
                container.innerHTML = html;
            }

            // 收集模板表单的参数值
            collectTemplateParams() {
                const category = document.getElementById('templateCategory').value;
                const subCategory = document.getElementById('templateSubCategory').value;
                
                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }

                if (!defs) {
                    const valueEl = document.getElementById('templateValue');
                    return valueEl ? valueEl.value : '';
                }

                const params = {};
                let hasAnyValue = false;
                defs.forEach(def => {
                    const input = document.getElementById('template-param-' + def.id);
                    const value = input ? input.value.trim() : '';
                    let unit = '';
                    if (def.units && def.units.length > 0) {
                        const unitSelect = document.getElementById('template-param-unit-' + def.id);
                        unit = unitSelect ? unitSelect.value : (def.defaultUnit || '');
                    }
                    params[def.id] = { value, unit };
                    if (value) hasAnyValue = true;
                });

                return hasAnyValue ? JSON.stringify(params) : '';
            }

            // 添加或更新模板
            addTemplate(e) {
                e.preventDefault();

                const template = {
                    name: document.getElementById('templateName').value,
                    category: document.getElementById('templateCategory').value,
                    subCategory: document.getElementById('templateSubCategory').value || '',
                    model: document.getElementById('templateModel').value,
                    brand: document.getElementById('templateBrand').value,
                    productCode: document.getElementById('templateProductCode').value,
                    value: addComponentManager.collectTemplateParams(),
                    stock: parseInt(document.getElementById('templateStock').value) || 0,
                    threshold: parseInt(document.getElementById('templateThreshold').value) || 0,
                    location: '',
                    notes: document.getElementById('templateNotes').value,
                    image: document.getElementById('templateImage').value || '',
                    displayText: document.getElementById('templateDisplayText').value // 自定义显示文字
                };

                if (this.editingTemplateId) {
                    // 更新现有模板
                    this.templates[this.editingTemplateId] = template;
                    this.showNotification('模板更新成功！', 'success');
                } else {
                    // 创建新模板
                    const templateId = 'custom-' + Date.now();
                    this.templates[templateId] = template;
                    this.showNotification('模板添加成功！', 'success');
                }

                // 保存到 localStorage
                this.saveCustomTemplates();

                // 重置表单和编辑状态
                this.cancelEditTemplate();

                // 重新渲染模板列表
                this.renderTemplatesList();
                this.renderTemplateCards();
            }

            // 编辑模板
            editTemplate(templateId) {
                const template = this.templates[templateId];
                if (!template) return;

                // 设置编辑状态
                this.editingTemplateId = templateId;

                // 填充表单
                document.getElementById('templateName').value = template.name || '';
                document.getElementById('templateCategory').value = template.category || '';
                
                // 先更新子类别选项，再设置子类别值
                this.updateTemplateSubCategoryOptions();
                document.getElementById('templateSubCategory').value = template.subCategory || '';
                
                // 更新分化参数字段
                this.updateTemplateParamFields();
                
                // 填充参数值
                const category = template.category || '';
                const subCategory = template.subCategory || '';
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                
                if (defs && template.value) {
                    // 尝试解析JSON格式的参数
                    try {
                        const params = JSON.parse(template.value);
                        defs.forEach(def => {
                            if (params[def.id]) {
                                const input = document.getElementById('template-param-' + def.id);
                                if (input) input.value = params[def.id].value || '';
                                if (def.units && def.units.length > 0) {
                                    const unitSelect = document.getElementById('template-param-unit-' + def.id);
                                    if (unitSelect) unitSelect.value = params[def.id].unit || def.defaultUnit || '';
                                }
                            }
                        });
                    } catch (e) {
                        // 旧格式：纯文本值，填入第一个参数输入框
                        const firstInput = document.getElementById('templateValue');
                        if (firstInput) firstInput.value = template.value || '';
                    }
                } else if (!defs) {
                    // 无分化参数，直接填入templateValue
                    const valueEl = document.getElementById('templateValue');
                    if (valueEl) valueEl.value = template.value || '';
                }
                
                document.getElementById('templateModel').value = template.model || '';
                document.getElementById('templateBrand').value = template.brand || '';
                document.getElementById('templateProductCode').value = template.productCode || '';
                document.getElementById('templateStock').value = template.stock || 0;
                document.getElementById('templateThreshold').value = template.threshold || 0;
                document.getElementById('templateNotes').value = template.notes || '';
                document.getElementById('templateImage').value = template.image || '';
                document.getElementById('templateDisplayText').value = template.displayText || '';

                // 更新UI
                const formTitle = document.getElementById('templateFormTitle');
                formTitle.innerHTML = `
                    <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    编辑模板
                `;

                document.getElementById('templateSubmitBtn').textContent = '更新模板';
                document.getElementById('cancelEditTemplate').classList.remove('hidden');

                // 滚动到表单顶部
                document.getElementById('addTemplateForm').scrollIntoView({ behavior: 'smooth', block: 'start' });

            // 自动分配元器件位置编号（主表单）
            autoAssignComponentLocation() {
                const category = document.getElementById('componentCategory').value;
                if (!category) {
                    this.showNotification('请先选择分类', 'error');
                    return;
                }

                // 定义默认分类前缀映射
                const defaultPrefixes = {
                    resistor: 'R',
                    capacitor: 'C',
                    inductor: 'L',
                    transistor: 'Q',
                    mosfet: 'Q',
                    diode: 'D',
                    led: 'D',
                    ic: 'U',
                    switch: 'SW',
                    crystal: 'Y',
                    other: 'M'
                };

                // 从 localStorage 读取用户自定义的前缀配置
                let prefix = defaultPrefixes[category] || 'M';
                try {
                    const savedPrefixes = localStorage.getItem('locationPrefixConfig');
                    if (savedPrefixes) {
                        const prefixConfig = JSON.parse(savedPrefixes);
                        if (prefixConfig[category]) {
                            prefix = prefixConfig[category];
                        }
                    }
                } catch (error) {
                    console.error('[模板] 读取位置编号前缀配置失败:', error);
                }

                // 获取已使用的位置编号
                const usedNumbers = new Set();

                // 从 localStorage 获取元器件数据
                try {
                    const componentsData = localStorage.getItem('electronicComponents');
                    if (componentsData) {
                        const components = JSON.parse(componentsData);
                        console.log('[自动分配] 所有元器件数据:', components);
                        console.log('[自动分配] 分类前缀:', prefix);

                        components.forEach(comp => {
                            console.log('[自动分配] 检查元器件:', comp.name, '位置:', comp.location);

                            // 支持多种位置编号格式：
                            // 格式1: C-001, R-002 (标准格式)
                            // 格式2: C001, R002 (无横杠格式)
                            // 格式3: C 001, R 002 (空格格式)

                            let num = null;

                            if (comp.location) {
                                // 尝试格式1: 前缀-数字
                                if (comp.location.startsWith(prefix + '-')) {
                                    const numPart = comp.location.substring(prefix.length + 1);
                                    num = parseInt(numPart, 10);
                                    console.log('[自动分配] 格式1匹配:', numPart, '->', num);
                                }
                                // 尝试格式2: 前缀数字 (无横杠)
                                else if (comp.location.startsWith(prefix)) {
                                    const numPart = comp.location.substring(prefix.length);
                                    num = parseInt(numPart, 10);
                                    console.log('[自动分配] 格式2匹配:', numPart, '->', num);
                                }
                            }

                            if (!isNaN(num) && num > 0) {
                                usedNumbers.add(num);
                                console.log('[自动分配] 添加已使用编号:', num);
                            }
                        });

                        console.log('[自动分配] 所有已使用的编号:', Array.from(usedNumbers).sort((a, b) => a - b));
                    }
                } catch (error) {
                    console.error('[自动分配] 读取元器件数据失败:', error);
                }

                // 找到最小的可用编号（从1开始，跳过所有已使用的编号）
                // 例如：如果已使用 1-36，则分配 37
                // 如果已使用 1-5 和 10-15，则分配 6（最小的可用编号）
                let minAvailable = 1;
                while (usedNumbers.has(minAvailable)) {
                    minAvailable++;
                }

                // 格式化为三位数（如 001, 002, 003）
                const formattedNumber = String(minAvailable).padStart(3, '0');
                const locationCode = `${prefix}-${formattedNumber}`;

                // 填充到输入框
                document.getElementById('componentLocation').value = locationCode;
                this.updatePreview(); // 实时更新预览
                
                // 显示详细信息，包括已使用的编号范围
                const usedArray = Array.from(usedNumbers).sort((a, b) => a - b);
                const usedRange = usedArray.length > 0 
                    ? `${usedArray[0]} ~ ${usedArray[usedArray.length - 1]}` 
                    : '无';
                this.showNotification(`已分配位置编号：${locationCode}（已使用编号：${usedRange}）`, 'success');
            }

            applyTemplate(templateId) {
                const template = this.templates[templateId];
                if (template) {
                    // 先设置类别，触发子类别和参数字段更新
                    const categoryEl = document.getElementById('componentCategory');
                    if (categoryEl && template.category) {
                        categoryEl.value = template.category;
                        categoryEl.dispatchEvent(new Event('change'));
                    }
                    
                    // 设置子类别，触发参数字段更新
                    setTimeout(() => {
                        const subCategoryEl = document.getElementById('componentSubCategory');
                        if (subCategoryEl && template.subCategory) {
                            subCategoryEl.value = template.subCategory;
                            subCategoryEl.dispatchEvent(new Event('change'));
                        }
                        
                        // 填充其他字段
                        Object.keys(template).forEach(key => {
                            if (key === 'category' || key === 'subCategory' || key === 'value') return;
                            const element = document.getElementById('component' + key.charAt(0).toUpperCase() + key.slice(1));
                            if (element) {
                                element.value = template[key];
                            }
                        });
                        
                        // 填充分化参数值
                        setTimeout(() => {
                            // 显式填充品牌和产品编码
                            const brandEl = document.getElementById('componentBrand');
                            if (brandEl && template.brand) brandEl.value = template.brand;
                            const productCodeEl = document.getElementById('componentProductCode');
                            if (productCodeEl && template.productCode) productCodeEl.value = template.productCode;

                            if (template.value) {
                                const category = template.category || '';
                                const subCategory = template.subCategory || '';
                                let defs = null;
                                if (subCategory && addComponentManager.subCategoryParamDefinitions[category] && addComponentManager.subCategoryParamDefinitions[category][subCategory]) {
                                    defs = addComponentManager.subCategoryParamDefinitions[category][subCategory];
                                }
                                if (!defs) {
                                    defs = addComponentManager.paramDefinitions[category];
                                }
                                
                                if (defs) {
                                    try {
                                        const params = JSON.parse(template.value);
                                        defs.forEach(def => {
                                            if (params[def.id]) {
                                                const input = document.getElementById('param-' + def.id);
                                                if (input) input.value = params[def.id].value || '';
                                                if (def.units && def.units.length > 0) {
                                                    const unitSelect = document.getElementById('param-unit-' + def.id);
                                                    if (unitSelect) unitSelect.value = params[def.id].unit || def.defaultUnit || '';
                                                }
                                            }
                                        });
                                    } catch (e) {
                                        // 旧格式：纯文本值
                                        const valueEl = document.getElementById('componentValue');
                                        if (valueEl) valueEl.value = template.value || '';
                                    }
                                } else {
                                    const valueEl = document.getElementById('componentValue');
                                    if (valueEl) valueEl.value = template.value || '';
                                }
                            }
                            
                            this.updatePreview();
                            
                            // 模板应用动画
                            anime({
                                targets: '.form-card',
                                scale: [1, 1.02, 1],
                                duration: 300,
                                easing: 'easeOutQuart'
                            });
                        }, 50);
                    }, 50);
                }
            }

            validateForm(data) {

            // 渲染参数输入字段
            updateParamFields() {

                const subCategory = document.getElementById('componentSubCategory').value;

                }

                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                // 自定义分化参数 fallback
                if (!defs) {
                    const customParams = JSON.parse(localStorage.getItem('customParamDefinitions') || '{}');
                    defs = customParams[category] || null;
                }
                // 过滤掉可能的空元素（防止稀疏数组导致崩溃）
                if (defs) {
                    defs = defs.filter(d => d && d.id);
                }

                if (!defs || defs.length === 0) {
                    container.innerHTML = '<div><label class="block text-sm font-medium text-gray-300 mb-2">参数值</label>' +
                        '<input type="text" id="componentValue" class="form-input w-full px-4 py-3 text-white placeholder-gray-500" placeholder="如: 1kΩ, 100μF, NPN"></div>';
                    // 给动态生成的通用参数输入框绑定事件
                    const cv = document.getElementById('componentValue');
                    if (cv) {
                        cv.addEventListener('input', () => this.updatePreview());
                        cv.addEventListener('change', () => this.updatePreview());
                    }
                    return;
                }

                let html = '<div class="space-y-3">';
                defs.forEach(def => {
                    html += '<div>' +
                        '<label class="block text-sm font-medium text-gray-300 mb-2">' + def.label + '</label>' +
                        '<div class="flex space-x-2">' +
                        '<input type="text" id="param-' + def.id + '" value="" class="flex-1 px-4 py-3 text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="输入' + def.label + '">';
                    if (def.units && def.units.length > 0) {
                        html += '<select id="param-unit-' + def.id + '" class="w-24 px-3 py-3 text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">';
                        def.units.forEach(u => {
                            html += '<option value="' + u + '"' + (u === def.defaultUnit ? ' selected' : '') + '>' + u + '</option>';
                        });
                        html += '</select>';
                    }
                    html += '</div></div>';
                });
                html += '</div>';
                container.innerHTML = html;

                // 给动态生成的参数字段绑定 input 事件，实时更新预览
                container.querySelectorAll('input[id^="param-"], select[id^="param-unit-"]').forEach(el => {
                    el.addEventListener('input', () => this.updatePreview());
                    el.addEventListener('change', () => this.updatePreview());
                });
