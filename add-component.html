                        capacitor: '电容',
                        inductor: '电感',
                        transistor: '三极管',
                        mosfet: 'MOS管',
                        diode: '二极管',
                        led: 'LED',
                        ic: '集成电路',
                        switch: '开关',
                        crystal: '晶振',
                        other: '其他'
                    };
                    // 定义分类颜色
                    const categoryColors = {
                        resistor: { border: 'border-blue-500/40', bg: 'bg-blue-500/10', text: 'text-blue-400' },
                        capacitor: { border: 'border-yellow-500/40', bg: 'bg-yellow-500/10', text: 'text-yellow-400' },
                        inductor: { border: 'border-green-500/40', bg: 'bg-green-500/10', text: 'text-green-400' },
                        transistor: { border: 'border-purple-500/40', bg: 'bg-purple-500/10', text: 'text-purple-400' },
                        mosfet: { border: 'border-red-500/40', bg: 'bg-red-500/10', text: 'text-red-400' },
                        diode: { border: 'border-orange-500/40', bg: 'bg-orange-500/10', text: 'text-orange-400' },
                        led: { border: 'border-pink-500/40', bg: 'bg-pink-500/10', text: 'text-pink-400' },
                        ic: { border: 'border-cyan-500/40', bg: 'bg-cyan-500/10', text: 'text-cyan-400' },
                        switch: { border: 'border-indigo-500/40', bg: 'bg-indigo-500/10', text: 'text-indigo-400' },
                        crystal: { border: 'border-teal-500/40', bg: 'bg-teal-500/10', text: 'text-teal-400' },
                        other: { border: 'border-gray-500/40', bg: 'bg-gray-500/10', text: 'text-gray-400' }
                    };

                    customTemplates.forEach(template => {
                        const category = template.category || 'other';
                        if (!categoryGroups[category]) {
                            categoryGroups[category] = [];
                        }
                        categoryGroups[category].push(template);
                    });

                    // 渲染每个分类
                    Object.keys(categoryGroups).sort().forEach(category => {
                        // 分组容器：**不再渲染分类标题** —— 分类改由每行的角标承担，
                        // 这里保留分组只为「同类相邻 + 组间留白」，故自身不带外边距，
                        // 组间间距交给 #quickTemplatesList 的 space-y-2（组内是 space-y-0.5）
                        const groupDiv = document.createElement('div');
                        groupDiv.className = '';

                        // 创建该分类的模板列表（紧凑列表行）
                        const templatesGrid = document.createElement('div');
                        templatesGrid.className = 'space-y-0.5';

                        // 渲染该分类的模板
                        categoryGroups[category].forEach(template => {
                            const row = document.createElement('div');
                            const colors = categoryColors[template.category] || categoryColors.other;
                            const barColor = (colors.text || categoryColors.other.text).replace('text', 'bg');
                            row.className = 'quick-template-item px-1.5 py-1 flex items-center gap-1.5 cursor-pointer';
                            row.dataset.template = template.id;

                            // 生成卡片显示内容 - 优先使用自定义显示文字
                            let displayTitle = '';
                            let displaySubtitle = '';
                            let displayMeta = '';
                            
                            // 如果有自定义显示文字，直接使用
                            if (template.displayText && template.displayText.trim()) {
                                displayTitle = template.displayText.trim();
                                // 如果有名称、型号、值等信息，可以显示为副标题
                                if (template.name || template.model || template.value) {
                                    const metaParts = [];
                                    if (template.model) metaParts.push(template.model);
                                    if (template.value && template.value !== template.displayText) metaParts.push(this.formatTemplateValue(template.value));
                                    displaySubtitle = metaParts.join(' | ');
                                }
                            } else {
                                // 没有自定义显示文字，使用自动生成逻辑
                                displayTitle = template.name || template.model || this.formatTemplateValue(template.value) || '未命名模板';
                                
                                if (!template.name && template.model) {
                                    displayTitle = template.model;
                                    displaySubtitle = this.formatTemplateValue(template.value);
                                } else if (template.name && template.model && template.value) {
                                    displaySubtitle = this.formatTemplateValue(template.value);
                                    displayMeta = template.model + (template.brand ? ' | ' + template.brand : '');
                                } else if (template.value) {
                                    displaySubtitle = this.formatTemplateValue(template.value);
                                    displayMeta = template.model || '';
                                } else if (template.model) {
                                    displaySubtitle = template.model;
                                    displayMeta = template.brand || '';
                                }
                            }

                            // 库存与预警：紧凑列表里压成行尾的小角标（图标 + 数字），不占独立一行
                            const isLowStock = template.stock < (template.threshold || 0);
                            const stockBadge = template.stock !== undefined && template.stock !== null
                                ? `<span class="flex items-center gap-0.5 shrink-0 text-[10px] tabular-nums ${isLowStock ? 'text-red-400' : 'text-gray-500'}" title="${isLowStock ? '库存不足（低于预警阈值）' : '库存'}">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                                    </svg>
                                    ${template.stock}
                                </span>`
                                : '';

                            // 明细行：型号/参数/品牌合并为一行（用 · 分隔），保证每条最多两行
                            const detailLine = [displaySubtitle, displayMeta].filter(Boolean).join(' · ');

                            // 分类角标：列表虽然按分类分组，但分组标题会随内部滚动滚出视野，
                            // 故每条自带一个分类标签（配色沿用该分类的 categoryColors）
                            const categoryLabel = categoryNames[template.category] || template.category || '其他';

                            // 位置信息一并进 tooltip：**只加 title，不加可见行** ——
                            // 34.3px 行高 / 最多两行文案是 v20260427ap 的既定几何，可见文案多一段
                            // 会和型号/参数抢宽度、破坏既有的截断行为
                            const locationHint = template.location
                                ? `位置: ${template.location}`
                                : (template.autoAssignLocation ? '位置: 自动（按类别顺延）' : '');

                            // 截断掉的完整文本走原生 tooltip（DOM 属性赋值，无需转义）
                            row.title = [displayTitle, categoryLabel, detailLine, locationHint].filter(Boolean).join(' · ');

                            row.innerHTML = `
                                <span class="w-0.5 h-3.5 rounded-full ${barColor} shrink-0"></span>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1 leading-tight">
                                        <span class="text-[11px] font-medium text-white truncate min-w-0">${this.escapeHtml(displayTitle)}</span>
                                        <span class="px-1 py-px rounded text-[10px] leading-none shrink-0 ${colors.bg} ${colors.text}" title="分类：${this.escapeAttr(categoryLabel)}">${this.escapeHtml(categoryLabel)}</span>
                                    </div>
                                    ${detailLine ? `<div class="text-[10px] text-gray-500 truncate leading-tight">${this.escapeHtml(detailLine)}</div>` : ''}
                                </div>
                                ${stockBadge}
                            `;
                            row.addEventListener('click', () => this.applyTemplate(template.id));
                            templatesGrid.appendChild(row);
                        });

                        groupDiv.appendChild(templatesGrid);
                        quickList.appendChild(groupDiv);
                    });
                } else {
                    // 没有要显示的模板，显示空状态，隐藏列表容器
                    quickList.innerHTML = '';
                    quickList.classList.add('hidden');
                    quickEmpty.classList.remove('hidden');

                    // 有模板但全没勾选时，「点击管理创建模板」是误导，改成说明真实原因
                    const hint = document.getElementById('quickTemplatesEmptyHint');
                    if (hint) {
                        hint.textContent = hiddenCount > 0
                            ? `有 ${hiddenCount} 个模板未勾选「显示在快速模板中」`
                            : '点击「管理」创建模板';
                    }
                }
            }
            
            applyTemplate(templateId) {
                const template = this.templates[templateId];
                if (template) {
                    // 先设置类别，触发子类别和参数字段更新
                    const categoryEl = document.getElementById('componentCategory');
                    if (categoryEl && template.category) {
                        categoryEl.value = template.category;
                        categoryEl.dispatchEvent(new Event('change'));
                    }
                    
                    // 设置子类别，触发参数字段更新
                    setTimeout(() => {
                        const subCategoryEl = document.getElementById('componentSubCategory');
                        if (subCategoryEl && template.subCategory) {
                            subCategoryEl.value = template.subCategory;
                            subCategoryEl.dispatchEvent(new Event('change'));
                        }
                        
                        // 填充其他字段
                        // ⚠️ 这里靠 'component' + 首字母大写(key) 的命名约定做映射 —— 模板的手动位置编号
                        //    就是靠它（location → #componentLocation）写进主表单的。将来若重命名
                        //    #componentLocation，这条路径会**静默失效**（不报错、只是不填）。
                        //    不存在的 id（displayText / autoAssignLocation / inQuickTemplates）由 if (element) 兜住
                        Object.keys(template).forEach(key => {
                            if (key === 'category' || key === 'subCategory' || key === 'value') return;
                            const element = document.getElementById('component' + key.charAt(0).toUpperCase() + key.slice(1));
                            if (element) {
                                element.value = template[key];
                            }
                        });
                        
                        // 填充分化参数值
                        setTimeout(() => {
                            // 显式填充品牌和产品编码
                            const brandEl = document.getElementById('componentBrand');
                            if (brandEl && template.brand) brandEl.value = template.brand;
                            const productCodeEl = document.getElementById('componentProductCode');
                            if (productCodeEl && template.productCode) productCodeEl.value = template.productCode;

                            if (template.value) {
                                const category = template.category || '';
                                const subCategory = template.subCategory || '';
                                let defs = null;
                                if (subCategory && addComponentManager.subCategoryParamDefinitions[category] && addComponentManager.subCategoryParamDefinitions[category][subCategory]) {
                                    defs = addComponentManager.subCategoryParamDefinitions[category][subCategory];
                                }
                                if (!defs) {
                                    defs = addComponentManager.paramDefinitions[category];
                                }
                                
                                if (defs) {
                                    try {
                                        const params = JSON.parse(template.value);
                                        defs.forEach(def => {
                                            if (params[def.id]) {
                                                const input = document.getElementById('param-' + def.id);
                                                if (input) input.value = params[def.id].value || '';
                                                if (def.units && def.units.length > 0) {
                                                    const unitSelect = document.getElementById('param-unit-' + def.id);
                                                    if (unitSelect) unitSelect.value = params[def.id].unit || def.defaultUnit || '';
                                                }
                                            }
                                        });
                                    } catch (e) {
                                        // 旧格式：纯文本值
                                        const valueEl = document.getElementById('componentValue');
                                        if (valueEl) valueEl.value = template.value || '';
                                    }
                                } else {
                                    const valueEl = document.getElementById('componentValue');
                                    if (valueEl) valueEl.value = template.value || '';
                                }
                            }
                            
                            this.updatePreview();

                            // 模板应用动画
                            anime({
                                targets: '.form-card',
                                scale: [1, 1.02, 1],
                                duration: 300,
                                easing: 'easeOutQuart'
                            });

                            // 如果模板启用了自动匹配位置编号，自动分配（按类别顺延）
                            if (template.autoAssignLocation) {
                                setTimeout(() => this.autoAssignComponentLocation(), 100);
                            }
                        }, 50);
                    }, 50);
                }
            }
            
            getFormData() {
                const category = document.getElementById('componentCategory').value;
                const imageUrl = document.getElementById('componentImage').value.trim();
                const datasheetUrl = document.getElementById('componentDatasheet').value.trim();

                return {
                    name: document.getElementById('componentName').value,
                    model: document.getElementById('componentModel').value,
                    brand: document.getElementById('componentBrand').value,
                    productCode: document.getElementById('componentProductCode').value,
                    category: category,
                    subCategory: document.getElementById('componentSubCategory').value || '',
                    value: addComponentManager.collectParams(),
                    params: addComponentManager.collectParams(),
                    stock: parseInt(document.getElementById('componentStock').value) || 0,
                    price: parseFloat(document.getElementById('componentPrice').value) || 0,
                    threshold: parseInt(document.getElementById('componentThreshold').value) || 0,
                    location: document.getElementById('componentLocation').value,
                    notes: document.getElementById('componentNotes').value,
                    datasheet: datasheetUrl,
                    image: imageUrl || this.getDefaultImage(category)
                };
            }
            
            validateForm(data) {
                const required = ['name', 'model', 'category'];
                const missing = required.filter(field => !data[field]);
                
                if (missing.length > 0) {
                    this.showNotification(`请填写必填字段: ${missing.join(', ')}`, 'error');
                    return false;
                }
                
                if (data.stock < 0 || data.threshold < 0) {
                    this.showNotification('库存数量和预警阈值不能为负数', 'error');
                    return false;
                }
                
                return true;
            }

                    { id: 'p3', label: '功率', units: ['W', 'mW'], defaultUnit: 'W' },
                    { id: 'p4', label: '发光颜色', units: [] },
                    { id: 'p5', label: '色温', units: ['K'], defaultUnit: 'K' }
                ],
                crystal: [
                    { id: 'p1', label: '标称频率', units: ['MHz', 'kHz', 'Hz'], defaultUnit: 'MHz' },
                    { id: 'p2', label: '负载电容', units: ['pF', 'nF', 'μF'], defaultUnit: 'pF' }
                ]
            };

            // 子类别关联的分化参数定义（仅当选中特定子类别时生效）
            subCategoryParamDefinitions = {
                ic: {
                    '单片机': [
                        { id: "p1", label: "内核框架", units: [], filterable: false },
                        { id: 'p2', label: 'Flash', units: ['B', 'KB', 'MB'], defaultUnit: 'KB' },

                        { id: "p5", label: "通用I/O数目", units: [], numeric: true }
                    ]
                }
            };

            // 渲染参数输入字段
            updateParamFields() {
                const container = document.getElementById('paramFields');
                if (!container) return;

                const category = document.getElementById('componentCategory').value;
                const subCategory = document.getElementById('componentSubCategory').value;

                // 未选择类别时，显示提示而非可编辑输入框
                if (!category) {
                    container.innerHTML = '<div class="opacity-50">' +
                        '<label class="block text-sm font-medium text-gray-400 mb-2">参数值</label>' +
                        '<p class="text-gray-500 text-sm py-2">请先选择类别</p>' +
                        '</div>';
                    return;
                }

                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                // 自定义分化参数 fallback
                if (!defs) {
                    const customParams = JSON.parse(localStorage.getItem('customParamDefinitions') || '{}');
                    defs = customParams[category] || null;
                }
                // 过滤掉可能的空元素（防止稀疏数组导致崩溃）
                if (defs) {
                    defs = defs.filter(d => d && d.id);
                }

                if (!defs || defs.length === 0) {
                    container.innerHTML = '<div><label class="block text-sm font-medium text-gray-300 mb-2">参数值</label>' +
                        '<input type="text" id="componentValue" class="form-input w-full px-4 py-3 text-white placeholder-gray-500" placeholder="如: 1kΩ, 100μF, NPN"></div>';
                    // 给动态生成的通用参数输入框绑定事件
                    const cv = document.getElementById('componentValue');
                    if (cv) {
                        cv.addEventListener('input', () => this.updatePreview());
                        cv.addEventListener('change', () => this.updatePreview());
                    }
                    return;
                }

                let html = '<div class="space-y-3">';
                defs.forEach(def => {
                    html += '<div>' +
                        '<label class="block text-sm font-medium text-gray-300 mb-2">' + def.label + '</label>' +
                        '<div class="flex space-x-2">' +
                        '<input type="text" id="param-' + def.id + '" value="" class="flex-1 px-4 py-3 text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="输入' + def.label + '">';
                    if (def.units && def.units.length > 0) {
                        html += '<select id="param-unit-' + def.id + '" class="w-24 px-3 py-3 text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">';
                        def.units.forEach(u => {
                            html += '<option value="' + u + '"' + (u === def.defaultUnit ? ' selected' : '') + '>' + u + '</option>';
                        });
                        html += '</select>';
                    }
                    html += '</div></div>';
                });
                html += '</div>';
                container.innerHTML = html;

                // 给动态生成的参数字段绑定 input 事件，实时更新预览
                container.querySelectorAll('input[id^="param-"], select[id^="param-unit-"]').forEach(el => {
                    el.addEventListener('input', () => this.updatePreview());
                    el.addEventListener('change', () => this.updatePreview());
                });
            }

            // 收集参数值
            collectParams() {
                const category = document.getElementById('componentCategory').value;
                const subCategory = document.getElementById('componentSubCategory').value;

                // 子类别关联定义优先
                let defs = null;
                if (subCategory && this.subCategoryParamDefinitions[category] && this.subCategoryParamDefinitions[category][subCategory]) {
                    defs = this.subCategoryParamDefinitions[category][subCategory];
                }
                if (!defs) {
                    defs = this.paramDefinitions[category];
                }
                // 自定义分化参数 fallback
                if (!defs) {
                    const customParams = JSON.parse(localStorage.getItem('customParamDefinitions') || '{}');
                    defs = customParams[category] || null;
                }
                // 过滤掉可能的空元素（防止稀疏数组导致崩溃）
                if (defs) {
                    defs = defs.filter(d => d && d.id);
                }
                if (!defs || defs.length === 0) {
                    const val = document.getElementById('componentValue');
                    return val ? val.value : '';
                }

                const params = defs.map(def => {
                    const value = document.getElementById('param-' + def.id)?.value || '';
                    const unitEl = document.getElementById('param-unit-' + def.id);
                    const unit = unitEl ? (unitEl.value || def.defaultUnit) : '';
                    return { id: def.id, label: def.label, value, unit };
                });

                return JSON.stringify(params);
            }

            // ========== 数据手册本地文件上传 ==========

            handleDatasheetFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (file.size > 50 * 1024 * 1024) {
                    alert('文件大小超过限制（最大 50MB）');
                    event.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.pendingDatasheetFileData = {
                        file: file,
                        data: e.target.result
                    };
                    const fileInfo = document.getElementById('addDatasheetFileInfo');
                    const fileName = document.getElementById('addDatasheetFileName');
                    if (fileInfo && fileName) {
                        fileName.textContent = file.name + ' (' + this.formatFileSize(file.size) + ')';
                        fileInfo.classList.remove('hidden');
                    }
                };
                reader.onerror = () => {
                    alert('文件读取失败，请重试');
                    event.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            }

            removeDatasheetFile() {
                this.pendingDatasheetFileData = null;
                const fileInfo = document.getElementById('addDatasheetFileInfo');
                if (fileInfo) fileInfo.classList.add('hidden');
                const fileInput = document.getElementById('addComponentDatasheetFile');
                if (fileInput) fileInput.value = '';
            }

            formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            addComponent(data) {
                var components = JSON.parse(localStorage.getItem('electronicComponents') || '[]');
                var newComponent = {
                    id: 'comp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    ...data,
                    createdAt: new Date().toISOString()
                };

                components.push(newComponent);

                // 按位置编号排序
                components.sort((a, b) => this.compareLocationNumbers(a.location, b.location));

                localStorage.setItem('electronicComponents', JSON.stringify(components));

                // 保存数据手册文件到 IndexedDB
                if (this.pendingDatasheetFileData) {
                    const dbName = 'ComponentDatasheetsDB';
                    const storeName = 'datasheets';
                    const request = indexedDB.open(dbName, 1);
                    request.onsuccess = () => {
                        const db = request.result;
                        const tx = db.transaction(storeName, 'readwrite');
                        tx.objectStore(storeName).put({
                            name: this.pendingDatasheetFileData.file.name,
                            type: this.pendingDatasheetFileData.file.type || 'application/octet-stream',
                            size: this.pendingDatasheetFileData.file.size,
                            data: this.pendingDatasheetFileData.data,
                            savedAt: new Date().toISOString()
                        }, newComponent.id);
                        tx.oncomplete = () => {
                            this.pendingDatasheetFileData = null;
                            db.close();
                        };
                    };
                }

                // 如果初始库存大于0，记录入库历史
                if (data.stock > 0) {
                    this.saveHistoryRecord('inbound', data.name, data.stock, 0, data.stock);
                }

                // 同步到服务端文件（同步 XHR，跳转前一定送达）
                this.syncToServer(components);

                return newComponent;
            }

            // 同步数据到服务端文件
            syncToServer(components, sync) {
                // 使用同步 XHR 确保跳转前数据一定到达服务端
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/data/components', false);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(JSON.stringify({ components: components }));
                    if (xhr.status !== 200) {
                        console.warn('[XHR] 同步到服务端失败:', xhr.status);
                    } else if (sync) {
                        // 同步设置到服务端
                        var settingsXhr = new XMLHttpRequest();
                        settingsXhr.open('POST', '/api/settings', false);
                        settingsXhr.setRequestHeader('Content-Type', 'application/json');
                        var allSettings = {};
                        ['systemSettings','subCategorySettings','locationPrefixConfig',
                         'categoryOrder','customCategories','customParamDefinitions'].forEach(function(k) {
                            var v = localStorage.getItem(k);
                            if (v) { try { allSettings[k] = JSON.parse(v); } catch(e) {} }
                        });
                        settingsXhr.send(JSON.stringify(allSettings));
                    }
                } catch (e) {
                    console.warn('[Server] 服务端未运行，同步已跳过');
                }
            }

            // 比较位置编号（用于排序）
            compareLocationNumbers(locA, locB) {
                // 如果两个都没有位置编号，保持原顺序
                if (!locA && !locB) return 0;
                // 如果只有a没有位置编号，a排在后面
                if (!locA) return 1;
                // 如果只有b没有位置编号，b排在后面
                if (!locB) return -1;

                // 解析位置编号格式：前缀-数字（如 A-001, B-123）
                const parseLocation = (loc) => {
                    const match = loc.match(/^([A-Za-z]+)-(\d+)$/);
                    if (match) {
                        return {
                            prefix: match[1].toUpperCase(),
                            number: parseInt(match[2], 10)
                        };
                    }
                    // 如果格式不匹配，返回原始字符串用于排序
                    return { prefix: loc.toUpperCase(), number: null };
                };

                const parsedA = parseLocation(locA);
                const parsedB = parseLocation(locB);

                // 先按前缀排序
                if (parsedA.prefix !== parsedB.prefix) {
                    return parsedA.prefix.localeCompare(parsedB.prefix);
                }

                // 如果前缀相同且都有数字，按数字排序
                if (parsedA.number !== null && parsedB.number !== null) {
                    return parsedA.number - parsedB.number;
                }

                // 如果只有一个有数字，有数字的排在前面
                if (parsedA.number !== null) return -1;
                if (parsedB.number !== null) return 1;

                // 都没有数字，保持原顺序
                return 0;
            }

            // 保存出入库历史记录
            saveHistoryRecord(type, componentName, quantity, beforeStock, afterStock) {
                const key = type === 'checkout' ? 'checkoutHistory' : 'inboundHistory';
                const history = JSON.parse(localStorage.getItem(key) || '[]');

                const record = {
                    id: Date.now().toString(),
                    componentName,
                    quantity,
                    beforeStock,
                    afterStock,
                    timestamp: new Date().toISOString()
                };

                history.push(record);

                // 只保留最近100条
                if (history.length > 100) {
                    history.splice(0, history.length - 100);
                }

                localStorage.setItem(key, JSON.stringify(history));
            }
            
            getDefaultImage(category) {
                // 必须与 main.js 的 ComponentManager.getDefaultImage 保持一致，
                // 否则预览显示的默认图与保存后在主页卡片上看到的不同
                const defaultImages = {
                    resistor: 'resources/images/resistors/resistor-collection.png',
                    capacitor: 'resources/images/capacitors/capacitor-collection.png',
                    inductor: 'https://kimi-web-img.moonshot.cn/img/upload.wikimedia.org/a2f2e16f8969ba3d2db5fb18bd86a57a05f18f6e.jpg',
                    transistor: 'https://kimi-web-img.moonshot.cn/img/www.buerklin.com/9318c346e9c8d3d4e9bc8df611e2bab6cae269f8.jpg',
                    mosfet: 'https://kimi-web-img.moonshot.cn/img/soldered.com/f1799c7b6f80ddb38cae3633c03f80cfc83de248.jpg',
                    diode: 'https://kimi-web-img.moonshot.cn/img/www.build-electronic-circuits.com/659b68c0c152c997f401ca30d570b2c98614aa04.jpg',
                    led: 'https://kimi-web-img.moonshot.cn/img/www.buerklin.com/9318c346e9c8d3d4e9bc8df611e2bab6cae269f8.jpg',
                    ic: 'resources/images/ics/ic-collection.png',
                    switch: 'https://kimi-web-img.moonshot.cn/img/www.build-electronic-circuits.com/8f8a7b8c9d0e1f2a3b4c5d6e7f8a9b0c.jpg',
                    crystal: 'https://kimi-web-img.moonshot.cn/img/www.build-electronic-circuits.com/1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d.jpg',
                    other: 'resources/images/hero-circuit-board.png'
                };
                return defaultImages[category] || 'resources/images/hero-circuit-board.png';
            }
            
            saveAndContinue() {
                try {
                    const data = this.getFormData();
                    if (!this.validateForm(data)) return;

                    this.addComponent(data);
                    this.showNotification('元器件添加成功！可以继续添加下一个。', 'success');
                    this.resetForm();
                } catch (e) {
                    console.error('保存元器件失败:', e);
                    this.showNotification('保存失败: ' + e.message, 'error');
                }
            }

            saveAndReturn() {
                try {
                    const data = this.getFormData();
                    if (!this.validateForm(data)) return;

                    // addComponent 内部用同步 XHR 写文件，完成后才返回
                    this.addComponent(data);
                    this.showNotification('元器件添加成功！', 'success');
                    window.location.href = 'index.html';
                } catch (e) {
                    console.error('保存元器件失败:', e);
                    this.showNotification('保存失败: ' + e.message, 'error');
                }
            }
            
            resetForm() {
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.value = val || '';
                };
                setVal('componentName', '');
                setVal('componentModel', '');
                setVal('componentBrand', '');
                setVal('componentProductCode', '');
                setVal('componentCategory', '');
                setVal('componentValue', '');
                setVal('componentSubCategory', '');
                setVal('componentStock', '');
                setVal('componentThreshold', '');
                setVal('componentPrice', '');
                setVal('componentLocation', '');
                setVal('componentNotes', '');
                setVal('componentDatasheet', '');
                setVal('componentImage', '');

                // 重新渲染参数字段（恢复为默认状态）
                this.updateParamFields();
                this.updatePreview();
            }
            
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 ${
                    type === 'success' ? 'bg-green-600' : 
                    type === 'error' ? 'bg-red-600' : 'bg-blue-600'
                } text-white`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.classList.remove('translate-x-full');
                }, 100);
                
                setTimeout(() => {
                    notification.classList.add('translate-x-full');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            window.addComponentManager = new AddComponentManager();
        });
    </script>

                                <label class="block text-sm font-medium text-gray-300 mb-2">元器件图片</label>
                                <input type="url" id="templateImage" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none" placeholder="https://example.com/image.jpg">
                                <p class="text-xs text-gray-500 mt-1">可选：输入图片的在线链接，留空则使用默认图片</p>
                            </div>
                            <!-- 位置编号：手动填写 与 自动匹配 互斥
                                 （勾选「自动匹配位置编号」时本框禁用并清空，见 syncTemplateLocationControls）
                                 ⚠️ 不能加 required：required 的禁用控件会被约束校验跳过，
                                    而重新启用后若为空又会卡住提交 -->
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-300 mb-2">位置编号</label>
                                <input type="text" id="templateLocation"
                                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:border-green-400 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed"
                                       placeholder="如：R-001">
                                <p class="text-xs text-gray-500 mt-1">可选：应用模板时写入「存放位置」；勾选下方自动匹配时本框不可用</p>
                            </div>
                            <div class="mt-4">
                                <label class="flex items-center cursor-pointer group">
                                    <input type="checkbox" id="templateAutoAssignLocation" class="w-4 h-4 rounded bg-gray-700 border-gray-600 text-green-500 focus:ring-green-400 focus:ring-offset-gray-800 cursor-pointer">
                                    <span class="ml-2 text-sm font-medium text-gray-300 group-hover:text-white transition-colors">自动匹配位置编号</span>
                                </label>
                                <p class="text-xs text-gray-500 mt-1 ml-6">勾选后，每次使用该模板时按该类别自动顺延分配位置编号</p>
                            </div>
                            <div class="mt-4">
                                <button id="templateSubmitBtn" type="submit" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors">
                                    添加模板
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- 现有模板列表 -->
                    <div>
                        <h3 class="text-lg font-semibold text-white mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                            现有模板
                        </h3>
                        <div id="templatesList" class="space-y-3">
                            <!-- 模板列表将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
